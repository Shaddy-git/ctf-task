<!DOCTYPE html>
<html>
    <style>
    body {
      font-family: 'Courier New', monospace;
      background: #0a0e1a;
      color: #00ff9d;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 700px;
      margin: 0 auto;
      border: 2px solid #00ff9d;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
      background: rgba(10, 14, 26, 0.95);
    }
    
    h2 {
      color: #fff;
      border-bottom: 1px solid #00ff9d;
      padding-bottom: 15px;
      margin-top: 0;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    
    h2::before {
      content: "> ";
      color: #00ff9d;
    }
    
    ul {
      list-style: none;
      padding: 0;
    }
    
    li {
      margin: 10px 0;
      border-left: 3px solid transparent;
      transition: all 0.3s;
    }
    
    li:hover {
      border-left-color: #00ff9d;
      background: rgba(0, 255, 157, 0.1);
    }
    
    a {
      display: block;
      padding: 12px 20px;
      color: #88ffc0;
      text-decoration: none;
      font-size: 16px;
    }
    
    a:hover {
      color: #fff;
    }
    
    /* Добавляем размеры файлов (как в терминале) */
    a::after {
      float: right;
      color: #666;
      font-size: 14px;
    }
    
    a[href$=".wav"]::after {
      content: "[1.2 MB]";
    }
    a[href$=".mp4"]::after {
      content: "[8.5 MB]";
    }
    a[href$=".css"]::after {
      content: "[4 KB]";
    }
    a[href$=".txt"]::after {
      content: "[1 KB]";
    }
    a[href$=".bundle"]::after {
      content: "[2.3 MB]";
    }
    a[href$=".png"]::after {
      content: "[156 KB]";
    }
    
    .terminal-prompt {
      color: #666;
      margin-top: 30px;
      font-size: 14px;
    }
    
    .terminal-prompt span {
      color: #00ff9d;
    }
  </style>

</html>
